<!DOCTYPE html>
<html lang="hu">

<head>
	<meta charset="utf-8" />
	<title>Fegyvercraft</title>
	<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet" />
	<link href="style.css" rel="stylesheet" />
</head>

<body>
	<div id="stage">
		<div class="modal">

			<!-- header -->
			<div class="bar">
				<div class="logo">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
						stroke-linejoin="round">
						<path d="M7 10h3V7L6.5 3.5a6 6 0 0 1 8 8l6 6a2 2 0 0 1-3 3l-6-6a6 6 0 0 1-8-8L7 8z" />
					</svg>
				</div>
				<div>
					<div class="k">Jogosultsághoz kötött gyártás</div>
					<div class="name">Fegyver<b>craft</b></div>
				</div>
				<div class="spacer"></div>
				<div class="badge"><span class="dot"></span><span id="who"></span></div>
				<div class="close" id="close" title="Bezárás">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
						<path d="M18 6 6 18M6 6l12 12" />
					</svg>
				</div>
			</div>

			<div class="body">

				<!-- jobs -->
				<div class="panel">
					<div class="wm">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
							<path d="M4 7h16M4 12h16M4 17h10" />
						</svg>
					</div>
					<div class="phead">
						<div class="pico">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
								stroke-linecap="round" stroke-linejoin="round">
								<path d="M4 6h16M4 12h16M4 18h10" />
							</svg>
						</div>
						<div>
							<div class="pt" id="ptitle">Kínálat</div>
							<div class="ps" id="count"></div>
						</div>
					</div>
					<!-- category tabs, filled from Config.Categories -->
					<div class="tabs" id="tabs"></div>
					<div class="scroll">
						<div class="list" id="list"></div>
					</div>
				</div>

				<!-- ingredients -->
				<div class="panel">
					<div class="wm">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
							stroke-linecap="round" stroke-linejoin="round">
							<path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z" />
							<path d="M12 12 20 7.5M12 12v9M12 12 4 7.5" />
						</svg>
					</div>
					<div class="phead">
						<div class="pico">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
								stroke-linecap="round" stroke-linejoin="round">
								<path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z" />
								<path d="M12 12 20 7.5M12 12v9M12 12 4 7.5" />
							</svg>
						</div>
						<div>
							<div class="pt">Alapanyagok</div>
							<div class="ps" id="ingsub">A kijelölt tétel alapanyagai</div>
						</div>
					</div>
					<div id="result"></div>
					<div class="scroll">
						<div class="ings" id="ings"></div>
					</div>
				</div>

				<!-- actions -->
				<div class="panel">
					<div class="wm">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
							stroke-linecap="round" stroke-linejoin="round">
							<path d="M3 21h18" />
							<path d="M6 18V9l6-4 6 4v9" />
						</svg>
					</div>
					<div class="phead">
						<div class="pico">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
								stroke-linecap="round" stroke-linejoin="round">
								<path d="M3 21h18" />
								<path d="M6 18V9l6-4 6 4v9" />
							</svg>
						</div>
						<div>
							<div class="pt">Gyártás</div>
							<div class="ps">Mennyiség és indítás</div>
						</div>
					</div>
					<div class="scroll">
						<div class="side" id="side"></div>
					</div>
				</div>

			</div>

			<div class="toast" id="toast"></div>
		</div>
	</div>

	<script src="app.js"></script>
</body>

</html>
