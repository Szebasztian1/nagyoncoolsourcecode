<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BC Rádió</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- Inline icon sprite (no external icon font: self-contained) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
        <symbol id="ic-radio" viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="12" rx="2"/><path d="M16 8l5-5"/><circle cx="8" cy="14" r="3"/><path d="M14.5 12.5h4.5M14.5 16h4.5"/></symbol>
        <symbol id="ic-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
        <symbol id="ic-power" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M7.5 6.5a7 7 0 1 0 9 0"/></symbol>
        <symbol id="ic-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8"/><path d="M19.7 5.5a9 9 0 0 1 0 13"/></symbol>
        <symbol id="ic-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></symbol>
        <symbol id="ic-warn" viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></symbol>
        <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></symbol>
        <symbol id="ic-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v4M9 21h6"/></symbol>
        <symbol id="ic-music" viewBox="0 0 24 24"><circle cx="7" cy="17" r="2.5"/><circle cx="17" cy="15" r="2.5"/><path d="M9.5 17V6l10-2v11"/></symbol>
        <symbol id="ic-guitar" viewBox="0 0 24 24"><circle cx="8" cy="16" r="4"/><circle cx="8" cy="16" r="1"/><path d="M11 13l6-6"/><path d="M16 4l4 4"/></symbol>
        <symbol id="ic-vinyl" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></symbol>
        <symbol id="ic-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.4L12 17.8 6.1 20.6l1.3-6.4L2.7 9.6l6.3-.7z"/></symbol>
        <symbol id="ic-wave" viewBox="0 0 24 24"><path d="M2 10c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/><path d="M2 16c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/></symbol>
        <symbol id="ic-headphones" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4.5" height="6" rx="1.5"/><rect x="16.5" y="14" width="4.5" height="6" rx="1.5"/></symbol>
        <symbol id="ic-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-4 3v-3H4z"/></symbol>
        <symbol id="ic-fire" viewBox="0 0 24 24"><path d="M12 3c1 3-2 4-2 7a2 2 0 0 0 4 0c2 2 3 4 3 6a5 5 0 0 1-10 0c0-4 4-6 5-13z"/></symbol>
        <symbol id="ic-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
    </defs></svg>

    <div id="stage">
        <div id="app" v-cloak>
            <div class="wrap" v-if="visible">
                <div class="overlay" @click="close"></div>
                <div class="modal">
                    <!-- Header -->
                    <div class="bar">
                        <div class="brand">
                            <div class="logo"><svg class="ic"><use href="#ic-radio"></use></svg></div>
                            <div class="head">
                                <div class="k">BC Rádió</div>
                                <div class="ttl">Magyar <b>Rádió</b></div>
                            </div>
                        </div>
                        <div class="close" @click="close" title="Bezárás (ESC)">
                            <svg class="ic"><use href="#ic-x"></use></svg>
                        </div>
                    </div>

                    <!-- Now playing strip -->
                    <div class="nowbar" :class="{ live: !!currentStation }">
                        <template v-if="currentStation">
                            <div class="ci"><svg class="ic"><use :href="'#ic-' + iconId(currentStation.icon)"></use></svg></div>
                            <div class="now-txt">
                                <div class="nn">{{ currentStation.name }}</div>
                                <div class="ng">{{ currentStation.genre }}</div>
                            </div>
                            <div class="eq"><span></span><span></span><span></span><span></span></div>
                        </template>
                        <div class="now-off" v-else>
                            <svg class="ic"><use href="#ic-radio"></use></svg> Nincs kiválasztott adó
                        </div>
                    </div>

                    <!-- Body -->
                    <div class="body">
                        <div class="wm"><svg class="ic"><use href="#ic-radio"></use></svg></div>

                        <div v-if="!xsound" class="warn">
                            <svg class="ic"><use href="#ic-warn"></use></svg>
                            <span>Az <b>xsound</b> nem fut a szerveren – a hang nem fog szólni.</span>
                        </div>

                        <div class="list">
                            <div v-for="s in stations" :key="s.id"
                                 class="chip" :class="{ on: s.id === current }"
                                 @click="select(s.id)">
                                <div class="ci"><svg class="ic"><use :href="'#ic-' + iconId(s.icon)"></use></svg></div>
                                <div class="cn">
                                    <div class="cn-t">{{ s.name }}</div>
                                    <div class="cn-d">{{ s.genre }}</div>
                                </div>
                                <div class="chk"><svg class="ic"><use href="#ic-check"></use></svg></div>
                            </div>
                        </div>
                    </div>

                    <!-- Footer: volume + actions -->
                    <div class="foot">
                        <div class="vol">
                            <svg class="ic"><use :href="volume === 0 ? '#ic-mute' : '#ic-volume'"></use></svg>
                            <input type="range" min="0" max="100" step="1"
                                   v-model.number="volume" @input="onVolume" />
                            <span class="vv">{{ volume }}%</span>
                        </div>
                        <div class="acts">
                            <button class="btn danger" :disabled="!current" @click="stop">
                                <svg class="ic"><use href="#ic-power"></use></svg> Kikapcsolás
                            </button>
                            <button class="btn ghost" @click="close">Bezárás</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/vue.global.prod.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
