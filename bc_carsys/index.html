    <script>
        window.addEventListener('message', function(event) {
            var data = event.data;
            if (data.type === 'data') {
                if (!data.show) {
                    document.getElementById('main').style.display = 'none';
                    return;
                }
                document.getElementById('main').style.display = 'flex';

                document.getElementById('milage').innerText = Intl.NumberFormat('de-DE').format(Math.round(data.milage)) + ' km';
                document.getElementById('inspection').innerText = Math.round((data.milage - data.lastinspection)) + ' km/'+data.nextinspection+'km';
                if (data.checkengine) {
                    document.getElementById('checkengine').style.display = 'block';
                } else {
                    document.getElementById('checkengine').style.display = 'none';
                }
            }
        });
    </script>
